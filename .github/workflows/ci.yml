name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pytest-asyncio ruff black
        pip install -e ".[langchain,openai]"

    - name: Install pinned independent Core validator
      run: pip install "jep-core-conformance @ git+https://github.com/hjs-spec/jep-core.git@de3b49d8d169ed505b114122b322dcf5f096394d"

    - name: Check package syntax
      run: python -m compileall -q jep_agent tests

    - name: Lint
      run: |
        ruff check jep_agent/ tests/
        black --check jep_agent/ tests/

    - name: Test
      run: python -m pytest tests/ -v --cov=jep_agent --cov-report=xml

    - name: Upload coverage
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.xml
        fail_ci_if_error: false

  package-coexistence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install build
      - run: python -m build --wheel
      - run: python scripts/check_coexistence.py dist/*.whl

  viewer-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the documented viewer container
        run: docker compose up --build --detach
      - name: Check the viewer HTTP entry
        run: |
          curl --fail --retry 12 --retry-all-errors --retry-max-time 45 --retry-delay 2 --max-time 10 http://127.0.0.1:8080/ --output /tmp/viewer.html
          grep -q 'JEP Event Viewer' /tmp/viewer.html
      - name: Show container diagnostics on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the viewer
        if: always()
        run: docker compose down
